<!DOCTYPE html>
<html lang="es">
<head>
  <style>
    /* EL PADRE FLEX */
    .menu {
      display: flex;                /* 1. Activa Flexbox */
      justify-content: space-between;/* 2. Empuja elementos a los extremos */
      align-items: center;          /* 3. Centra verticalmente */
      background-color: #1e293b;
      padding: 15px 30px;
      color: white;
    }

    .enlaces {
      display: flex;                /* Flex anidado para la lista */
      gap: 20px;                    /* Separación entre enlaces */
      list-style: none;
    }

    a { color: #38bdf8; text-decoration: none; }
  </style>
</head>
<body>

  <header class="menu">
    <div class="logo"><h2>MiSitioWeb</h2></div>
    <ul class="enlaces">
      <li><a href="#">Inicio</a></li>
      <li><a href="#">Cursos</a></li>
      <li><a href="#">Contacto</a></li>
    </ul>
  </header>

</body>
</html>
